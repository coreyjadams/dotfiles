---
# Verify SHA256 checksums of every downloaded asset against aqua-checksums.json.
# After bumping versions, regenerate with:
#   aqua -c dot_config/aquaproj-aqua/aqua.yaml update-checksum -prune
checksum:
  enabled: true
  require_checksum: true
registries:
  - type: standard
    ref: v4.562.0
packages:
  - name: git-lfs/git-lfs@v3.8.0
  - name: astral-sh/uv@0.12.13
  - name: bootandy/dust@v1.2.5
  - name: BurntSushi/ripgrep@15.2.0
  - name: ClementTsang/bottom@0.14.9
  - name: cli/cli@v2.100.0
  - name: dalance/procs@v0.14.12
  - name: dlvhdr/gh-dash@v4.25.2
  - name: git-town/git-town@v24.0.0
  - name: sharkdp/bat@v0.26.1
  - name: sharkdp/fd@v10.5.0
  - name: starship/starship@v1.26.0
  - name: zyedidia/micro@v2.0.15
  - name: rclone/rclone@v1.75.1
  - name: eza-community/eza@v0.23.5
  - name: zellij-org/zellij@v0.45.1

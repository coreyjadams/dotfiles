# rig settings; read at startup (/reload after a change).

# corey_rig::CapacityPlugin: when the gateway says the model is at capacity
# (429), retry the same model up to 12 times, backing off to 60 s. It never
# switches models.
[capacity]

# Side calls on a cheaper model, off the main model's shared token budget:
# [btw]
# model = "nvidia-inference/openai/openai/gpt-5.1-codex"
# [session_title]
# model = "nvidia-inference/openai/openai/gpt-5.1-codex"

# corey_rig::ContextPruningPlugin: off. Stubbing old tool results rewrites
# history mid-session, so on Claude via Inference Hub each prune re-writes
# the whole cached prefix (~100k tokens at 1.25x) to save a few thousand
# read at 0.1x. Compaction still trims near the window; `/prune on` for a
# session.
[context_pruning]
enabled = false
